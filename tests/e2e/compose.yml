name: morrow-e2e

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: morrow_e2e
      POSTGRES_USER: morrow_e2e
      POSTGRES_PASSWORD: morrow_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morrow_e2e -d morrow_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  morrow:
    image: morrow-e2e:test
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18173:1337"
    environment:
      DATABASE_URL: postgresql://morrow_e2e:morrow_e2e@postgres:5432/morrow_e2e
      AUTH_SECRET: browser-tests-only-not-a-production-secret
      MORROW_CLIENT_URL: http://localhost:18173
      REGISTRATION_OPEN: "true"
      MORROW_EMAIL_CONSOLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
