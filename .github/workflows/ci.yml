name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Dead code and unused dependencies
        run: pnpm knip
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        env:
          NODE_OPTIONS: --no-experimental-webstorage
        run: pnpm test
      - name: Deployment and security scripts
        run: pnpm test:security
      - name: i18n consistency
        run: pnpm i18n:check

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://morrow:morrow_local_dev@localhost:5432/morrow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Compose, not a service container: Postgres must start with logical
      # replication, which a service container cannot configure.
      - name: Start Postgres and Electric
        run: |
          docker compose -f compose.local.yml up -d --wait postgres
          NODE_ENV=test pnpm --filter @morrow/api db:migrate
          docker compose -f compose.local.yml up -d --wait electric
      - name: API integration tests
        run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm --dir tests/e2e install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir tests/e2e run browsers
      # The stack is Postgres with logical replication, real Electric and the
      # image built from this checkout.
      - name: Start the stack
        run: docker compose -f tests/e2e/compose.yml up --build --wait --wait-timeout 600
      - name: Browser tests
        run: pnpm test:e2e
      - name: Stack logs
        if: failure()
        run: docker compose -f tests/e2e/compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f tests/e2e/compose.yml down --volumes
