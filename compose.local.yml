services:
  postgres:
    image: postgres:16-alpine
    # Electric reads the write-ahead log, so Postgres must log at the logical
    # level. The WAL cap stops a stopped Electric from filling the disk.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=10GB
    environment:
      POSTGRES_DB: morrow
      POSTGRES_USER: morrow
      POSTGRES_PASSWORD: morrow_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/electric-role.sql:/docker-entrypoint-initdb.d/electric-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morrow -d morrow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sync service: streams the synced tables to the browser through Morrow's
  # /api/shapes proxy. Reads Postgres through the `electric` replication role.
  electric:
    image: electricsql/electric@sha256:efb6fa43859d67cb8c73439e0c8bc0f7a3daa467500fb06f2a924bcb2070c139
    environment:
      DATABASE_URL: postgresql://electric:electric_local_dev@postgres:5432/morrow?sslmode=disable
      ELECTRIC_SECRET: morrow_local_electric_secret
      ELECTRIC_MANUAL_TABLE_PUBLISHING: "true"
      # Defaults to ./persistent, outside the volume.
      ELECTRIC_STORAGE_DIR: /var/lib/electric
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - electric_data:/var/lib/electric
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Durable Streams: the pages' update logs. Morrow's api process reaches it
  # at DURABLE_STREAMS_URL; nothing else needs to.
  durable-streams:
    build: ./docker/durable-streams
    ports:
      - "127.0.0.1:4437:4437"
    volumes:
      - durable_streams_data:/data
    restart: unless-stopped

  # Dev only: HTTPS and HTTP/2 in front of the Vite dev server (see
  # docker/Caddyfile). Open https://localhost:5443.
  caddy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # On the host network it reaches the dev server on localhost without a
    # firewall rule for container-to-host traffic.
    network_mode: host
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
    restart: unless-stopped

  # S3-compatible storage for avatars; production uses Cloudflare R2 through
  # the same S3_* variables. `minio-init` makes the buckets public-read, as the
  # R2 bucket is. Ports differ from Callus's MinIO so both can run together.
  minio:
    # MinIO no longer publishes images; this is the last Bitnami build, pinned
    # by digest. It carries both the server and the `mc` client.
    image: bitnamilegacy/minio@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    restart: unless-stopped
    # The image runs as uid 1001, which cannot write a fresh named volume.
    user: "0:0"
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: morrow
      MINIO_ROOT_PASSWORD: morrow_local_dev
    ports:
      - "127.0.0.1:9020:9000"
      - "127.0.0.1:9021:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc=/opt/bitnami/minio-client/bin/mc
        $$mc alias set local http://minio:9000 morrow morrow_local_dev &&
        for bucket in morrow morrow-test; do
          $$mc mb --ignore-existing local/$$bucket &&
          $$mc anonymous set download local/$$bucket
        done

  morrow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://morrow:morrow_local_dev@postgres:5432/morrow
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploying-000000}
      MORROW_CLIENT_URL: ${MORROW_CLIENT_URL:-http://localhost:1337}
      ELECTRIC_URL: http://electric:3000
      ELECTRIC_SECRET: morrow_local_electric_secret
      MAX_WORKSPACES_PER_USER: ${MAX_WORKSPACES_PER_USER:-3}
      MORROW_EMAIL_CONSOLE: ${MORROW_EMAIL_CONSOLE:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      MORROW_TURNSTILE_SITE_KEY: ${MORROW_TURNSTILE_SITE_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  electric_data:
  durable_streams_data:
