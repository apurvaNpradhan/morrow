  <style>
    /* The first paint, before any script: keep these colours in step with the
       tokens in src/index.css (a test checks they match). */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #ffffff;
      color: #111111;
      font: 0.75rem/1 "Inter Variable", system-ui, sans-serif;
    }
    #splash[data-theme="dark"] {
      background: #0a0a0a;
      color: #ededed;
    }
    /* The panel the app draws beside its sidebar. */
    #splash i {
      display: none;
      position: absolute;
      inset: 0.5rem 0.5rem 0.5rem 15.5rem;
      border: 1px solid #eaeaea;
      border-radius: 0.75rem;
    }
    #splash[data-theme="dark"] i {
      border-color: #2a2a2a;
    }
    /* Shown only after a beat, so a fast load never flashes it. */
    #splash svg {
      width: 3.5rem;
      fill: currentColor;
      animation: splash-in 0.3s ease-out 0.4s both;
    }
    #splash p {
      margin: 0;
      color: #666666;
      animation: splash-in 0.3s ease-out 2s both;
    }
    #splash:not([data-sidebar]) p {
      display: none;
    }
    #splash[data-theme="dark"] p {
      color: #9a9a9a;
    }
    @keyframes splash-in {
      from {
        opacity: 0;
      }
    }
    @media (min-width: 768px) {
      #splash[data-sidebar] {
        padding-inline-start: 15rem;
      }
      #splash[data-sidebar] i {
        display: block;
      }
    }
  </style>

<body>
  <div id="splash" data-theme="dark" aria-hidden="true">
    <i></i>
    <svg viewBox="96 146 320 220"><path fill-rule="evenodd" transform="translate(102.4 153.0) scale(0.97215)" d="M 211 7.5 C 183.2 13.1, 161.0 29.9, 148.7 54.7 L 143.6 64.9 140.5 62.6 C 132.4 56.3, 115.5 49.7, 103.5 48.0 C 66.0 42.6, 29.5 60.8, 13.6 92.6 C 6.4 107.0, 6.6 105.3, 6.2 158.2 L 5.8 206 30.4 206 L 54.9 206 55.2 166.7 L 55.5 127.5 58.4 121.6 C 64.5 109.5, 74.7 103.5, 89 103.5 C 103.4 103.4, 113.0 109.3, 118.8 121.8 L 121.5 127.5 121.8 166.7 L 122.1 206.0 148.8 205.7 L 175.5 205.5 176 151.5 L 176.5 97.5 179.1 92 C 193.8 60.9, 237.8 60.2, 252.3 90.7 L 255.5 97.5 255.7 151.7 L 256.0 206 283.0 206 L 310.0 206 309.7 138.2 C 309.3 62.1, 309.6 65.2, 301.4 48.5 C 286.1 17.4, 247.7 0.0, 211 7.5"/></svg>
    <p>Loading your workspace…</p>
  </div>
  <div id="root"></div>
  <script id="splash-script">
    (function () {
      var splash = document.getElementById('splash');
      try {
        var prefs = JSON.parse(localStorage.getItem('device-preferences') || 'null');
        var device = (prefs && prefs['s:device'] && prefs['s:device'].data) || {};
        var theme = device.theme || 'dark';
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        splash.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        // The sidebar outline needs a known user, a page that has a sidebar
        // and the sidebar open by default; the stylesheet adds the width check.
        var stamp = JSON.parse(localStorage.getItem('morrow:owner-stamp') || 'null');
        var noSidebar = /^\/(auth|invitation|mcp|privacy|onboarding|test-error)(\/|$)/.test(location.pathname);
        if (stamp && typeof stamp.userId === 'string' && !noSidebar && device.sidebarDefaultOpen !== false) {
          splash.setAttribute('data-sidebar', '');
        }
      } catch (e) {
        // Blocked or malformed storage: the dark default stays.
      }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
